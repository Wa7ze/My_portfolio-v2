      as="font"

    <link

      as="font"

    <script>
      // Section reveal is a progressive enhancement: only hide sections when motion is allowed.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('js-reveal');
      }
    </script>
    <style>
      /* Boot loader (ported from the legacy web/index.html). Inline so it paints before the bundle. */
      html {
        background: #0b1426;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        background: linear-gradient(180deg, #0b1426, #16233f);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #boot .frame {
        width: 640px;
        max-width: 92vw;
        margin-top: 28vh;
        border-radius: 14px;
        border: 1px solid rgb(61 224 255 / 0.22);
        background: rgb(15 26 49 / 0.9);
        overflow: hidden;
        box-shadow: 0 24px 60px -24px rgb(5 10 22 / 0.8);
      }
      #boot .titlebar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 12px;
        border-bottom: 1px solid rgb(61 224 255 / 0.14);
      }
      #boot .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      #boot .dot.r {
        background: #ff7a85;
      }
      #boot .dot.y {
        background: #ffb547;
      }
      #boot .dot.g {
        background: #5ef0a8;
      }
      #boot .addressbar {
        margin: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        background: #0b1426;
        border: 1px solid rgb(61 224 255 / 0.14);
        color: #eaf0fa;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
      }
      #boot .caret {
        display: inline-block;
        width: 7px;
        margin-left: 1px;
        background: #3de0ff;
        animation: boot-blink 1s step-end infinite;
      }
      #boot .status {
        margin: 0 12px 14px;
        color: #8f9fc0;
        font-size: 12px;
      }
      @keyframes boot-blink {
        50% {
          opacity: 0;
        }
      }
      #boot.fade-out {
        opacity: 0;
        transition: opacity 300ms ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          display: none;
        }
      }
    </style>
    <noscript
      ><style>
        #boot {
          display: none;
        }
      </style></noscript
    >
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="frame">
        <div class="titlebar">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        </div>
        <div class="addressbar"><span id="boot-url"></span><span class="caret">&nbsp;</span></div>
        <div class="status" id="boot-status">resolving DNS&hellip;</div>
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById('boot');
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          boot.remove();
          return;
        }
        var url = location.hostname + (location.pathname === '/' ? '' : location.pathname);
        var urlEl = document.getElementById('boot-url');
        var statusEl = document.getElementById('boot-status');
        var start = Date.now(),
          typed = 0,
          typingDone = false,
          dotCount = 0,
          statusIndex = 0;
        var cycle = ['resolving DNS…', 'TLS handshake…', 'connecting'];
        var typeTimer, statusTimer;
        function render() {
          urlEl.textContent = url.slice(0, typed);
        }
        (function typeStep() {
          if (typed >= url.length) {
            typingDone = true;
            return;
          }
          typed += 1;
          render();
          typeTimer = setTimeout(typeStep, 45);
        })();
        (function statusStep() {
          if (typingDone) {
            var label = cycle[Math.min(statusIndex, cycle.length - 1)];
            var dots = statusIndex >= cycle.length - 1 ? '.'.repeat((dotCount % 3) + 1) : '';
            statusEl.textContent = label + dots;
            dotCount += 1;
            if (statusIndex < cycle.length - 1 && dotCount % 6 === 0) statusIndex += 1;
          }
          statusTimer = setTimeout(statusStep, 260);
        })();
        window.bootDone = function () {
          clearTimeout(typeTimer);
          clearTimeout(statusTimer);
          typed = url.length;
          render();
          setTimeout(
            function () {
              boot.classList.add('fade-out');
              setTimeout(function () {
                boot.remove();
              }, 300);
            },
            Math.max(0, 600 - (Date.now() - start)),
          );
        };
      })();
    </script>

    <div id="root">
      <!-- Visually hidden summary for crawlers/no-JS (as in the legacy site); replaced when the app mounts. -->
      <main
        style="
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
          white-space: nowrap;
        "
      >

        <p>Software Engineer building with Flutter, Python, and AI.</p>
      </main>
    </div>

        Mazen Matran | Software Engineer. This site requires JavaScript to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
