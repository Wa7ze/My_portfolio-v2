# Netlify config for the Vite build. Same site as the legacy Flutter app
# (https://mazenportfolio.netlify.app/). See DEPLOY.md for the switch-over steps.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Legacy multi-page routes (pre-redesign Flutter site) -> in-page anchors.
[[redirects]]
  from = "/work/*"
  to = "/#projects"
  status = 301
  force = true

[[redirects]]
  from = "/work"
  to = "/#projects"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301
  force = true

# No SPA catch-all: unknown paths get dist/404.html with a real 404 status.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
